<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو الفيديو AI الاحترافي</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Cairo', sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #111; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        textarea { width: 100%; height: 100px; background: #000; color: #d4af37; border: 1px solid #444; border-radius: 10px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 10px; background: #d4af37; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #resultImage { width: 100%; margin-top: 20px; border-radius: 15px; display: none; }
        .loader { color: #d4af37; text-align: center; margin: 20px 0; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 توليد الفيديو بالذكاء الاصطناعي</h2>
    <textarea id="prompt" placeholder="اكتب وصفاً دقيقاً للمشهد (مثال: طائرة تحلق فوق صنعاء، تصوير سينمائي)"></textarea>
    <button onclick="generateVideo()">بدء إنتاج الفيديو</button>

    <div id="loader" class="loader">جاري معالجة الفيديو في السيرفر الآمن... قد يستغرق الأمر دقيقة</div>
    <img id="resultImage" alt="النتيجة" />
</div>

<script>
    const BACKEND_URL = "https://visioncraft-backend.vercel.app";

    async function generateVideo() {
        const prompt = document.getElementById('prompt').value;
        if(!prompt) return alert('يرجى كتابة وصف الفيديو أولاً!');

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultImage').style.display = 'none';

        try {
            const response = await fetch(`${BACKEND_URL}/generate-video`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await response.json();
            if (data.error) {
                alert("خطأ: " + data.error);
                document.getElementById('loader').style.display = 'none';
                return;
            }
            
            pollResult(data.id);
        } catch (err) {
            alert("حدث خطأ أثناء الاتصال بالسيرفر");
            document.getElementById('loader').style.display = 'none';
        }
    }

    async function pollResult(id) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${BACKEND_URL}/check-status/${id}`);
                const data = await res.json();
                
                if (data.status === 'succeeded') {
                    clearInterval(interval);
                    document.getElementById('loader').style.display = 'none';
                    const img = document.getElementById('resultImage');
                    img.src = data.output;
                    img.style.display = 'block';
                } else if (data.status === 'failed') {
                    clearInterval(interval);
                    document.getElementById('loader').style.display = 'none';
                    alert('فشلت عملية التوليد.');
                }
            } catch (e) {
                console.error("خطأ في فحص الحالة");
            }
        }, 3000);
    }
</script>

</body>
</html>
